<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>openLLMdemo</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--fg:#1a1d21;--card:#fff;--me:#1a73e8;--bot:#e9ecf1;--bd:#d8dce3}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e6e8ec;--card:#1c1f25;--me:#3b82f6;--bot:#2a2e36;--bd:#343945}}
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card);font-weight:600}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:min(720px,85%);padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--me);color:#fff}.assistant{align-self:flex-start;background:var(--bot)}
.err{color:#d93025}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd);background:var(--card)}
textarea{flex:1;resize:none;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
button{padding:0 20px;border:0;border-radius:10px;background:var(--me);color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.5}
</style></head><body>
<header>openLLMdemo — chat</header>
<div id="log"></div>
<form id="f"><textarea id="q" rows="2" placeholder="Ask something… (Enter to send, Shift+Enter for newline)" autofocus></textarea><button id="b">Send</button></form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),b=document.getElementById('b'),hist=[],cid=crypto.randomUUID?crypto.randomUUID():String(Date.now());
const add=(role,text,cls='')=>{const d=document.createElement('div');d.className='m '+role+' '+cls;d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight;return d};
async function send(){
  const t=q.value.trim();if(!t)return;q.value='';b.disabled=true;
  hist.push({role:'user',content:t});add('user',t);const w=add('assistant','…');
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist,conversation_id:cid})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);
    w.textContent=j.reply;hist.push({role:'assistant',content:j.reply});
  }catch(e){w.textContent='Error: '+e.message;w.classList.add('err');hist.pop()}
  b.disabled=false;q.focus();
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send()};
q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
</script></body></html>
